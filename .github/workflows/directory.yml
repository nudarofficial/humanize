# Publishes the plugin-only edition to the `directory` branch, which the Claude directory tracks.
# Copyright (c) 2026 nudarofficial. MIT License, see LICENSE.
name: directory-branch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and push the directory branch
        run: |
          python tools/build_directory.py . "$RUNNER_TEMP/directory"
          cd "$RUNNER_TEMP/directory"
          git init -q -b directory
          git config user.name "nudarofficial"
          git config user.email "nudarofficial@users.noreply.github.com"
          git add -A
          git commit -q -m "Directory edition built from main@${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" directory
