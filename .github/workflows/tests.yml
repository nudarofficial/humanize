name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the skill against the Agent Skills spec
        run: |
          pip install skills-ref==0.1.1
          agentskills validate skills/humanize
      - name: Run tests
        run: python -m unittest discover -s tests -v
